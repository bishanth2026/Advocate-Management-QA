<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="reset-page-version" content="20261009-02"><title>Reset Password — AdvocateDesk</title><link rel="stylesheet" href="styles.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#172554;padding:20px}.reset-card{width:min(100%,520px);background:#fff;border-radius:20px;padding:38px;box-shadow:0 20px 60px #0002}.reset-card h1{color:#172554}.reset-card p{color:#64748b}.reset-card input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;margin:8px 0 16px}.reset-card button{width:100%;padding:14px;border:0;border-radius:10px;background:#4338ca;color:#fff;font-weight:700;cursor:pointer}.msg{margin-top:12px;color:#b91c1c;white-space:pre-wrap}.msg.ok{color:#15803d}</style></head><body><main class="reset-card"><h1>Set a new password</h1><p>Choose a new password for your AdvocateDesk account.</p><form id="resetForm" hidden><label for="pw">New password</label><input id="pw" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Update password</button></form><p id="status">Reset page version 20261009-02. For your security, click below to verify the reset link. This prevents email security scanners from using the link before you do.</p><button type="button" id="verifyLink">Continue to verify reset link</button><div id="msg" class="msg" role="alert"></div><p><a href="admin-login.html">Return to Admin Login</a> · <a href="login.html">Portal selection</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(function(){
"use strict";
const URL="https://ykxfidrtvmkmmbxameji.supabase.co";
const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlreGZpZHJ0dm1rbW1ieGFtZWppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODIwMjUsImV4cCI6MjEwNjQ1ODAyNX0.9m6LYk1i2i_B5iwNbjX5iYCHrGrnXFf-O7pFMWVDVDk";
const client=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const form=document.getElementById("resetForm"),status=document.getElementById("status"),msg=document.getElementById("msg");
let ready=false, linkParams=null;
function error(t){console.error("[AdvocateDesk reset] initialization/verification error:",t);ready=false;form.hidden=true;document.getElementById("verifyLink").hidden=true;status.textContent="";msg.textContent=t;msg.className="msg";}
function verified(){ready=true;form.hidden=false;document.getElementById("verifyLink").hidden=true;status.textContent="Reset link verified. Enter your new password.";msg.textContent="";msg.className="msg";}
function parseLink(){const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,""));return {q,h,tokenHash:q.get("token_hash")||h.get("token_hash"),type:q.get("type")||h.get("type"),code:q.get("code"),access:h.get("access_token"),refresh:h.get("refresh_token"),authError:q.get("error_description")||h.get("error_description")||q.get("error")||h.get("error")};}
async function initialize(){
 console.info("[AdvocateDesk reset] version=20261009-02 url="+location.href.split("?")[0]);
 linkParams=parseLink();
 if(linkParams.authError&&!linkParams.tokenHash&&!linkParams.code&&!(linkParams.access&&linkParams.refresh))throw new Error(linkParams.authError);
 if(linkParams.tokenHash||linkParams.code||(linkParams.access&&linkParams.refresh)){
   status.textContent="Ready to verify. Click “Continue to verify reset link” to proceed.";
   return;
 }
 const current=await client.auth.getSession();if(current.error)throw current.error;
 if(current.data.session){verified();return;}
 throw new Error("This reset link is missing, invalid, or expired. Return to Admin Login and request a new password reset email.");
}
document.getElementById("verifyLink").addEventListener("click",async function(){
 const b=this;b.disabled=true;b.textContent="Verifying…";msg.textContent="";
 try{
   const p=parseLink();
   if(p.authError&&!p.tokenHash&&!p.code&&!(p.access&&p.refresh))throw new Error(p.authError);
   if(p.tokenHash){
     const type=p.type||"recovery";
     if(type!=="recovery")throw new Error("This is not a password recovery link. Request a new reset email.");
     const result=await client.auth.verifyOtp({token_hash:p.tokenHash,type:"recovery"});
     if(result.error)throw result.error;
     if(!result.data.session)throw new Error("The reset link could not be verified. Request a new password reset email.");
     verified();return;
   }
   if(p.code){
     const result=await client.auth.exchangeCodeForSession(p.code);
     if(result.error)throw result.error;
     if(result.data.session){verified();return;}
   }
   if(p.access&&p.refresh){
     const result=await client.auth.setSession({access_token:p.access,refresh_token:p.refresh});
     if(result.error)throw result.error;
     if(result.data.session){verified();return;}
   }
   throw new Error("The reset link is missing required verification details. Request a new password reset email.");
 }catch(e){error(e.message||"Unable to verify reset link. Request a new one.");}
 finally{b.disabled=false;b.textContent="Continue to verify reset link";}
});
client.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY"&&session)verified();});
initialize().catch(e=>error(e.message||"Unable to load reset page. Request a new link."));
form.addEventListener("submit",async e=>{
 e.preventDefault();if(!ready)return;
 const p=document.getElementById("pw").value,c=document.getElementById("confirm").value;
 if(p.length<8){error("Use at least 8 characters.");return;}
 if(p!==c){msg.textContent="Passwords do not match.";msg.className="msg";return;}
 const b=form.querySelector("button");b.disabled=true;b.textContent="Updating…";
 try{const result=await client.auth.updateUser({password:p});if(result.error)throw result.error;ready=false;form.hidden=true;status.textContent="Password updated successfully. You can now sign in.";msg.textContent="Your password has been changed. Please sign in with your new password.";msg.className="msg ok";await client.auth.signOut();}
 catch(x){msg.textContent=x.message||"Password update failed. Request a new reset link.";msg.className="msg";}
 finally{b.disabled=false;b.textContent="Update password";}
});
})();
</script></body></html>
