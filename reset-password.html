<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — AdvocateDesk</title><link rel="stylesheet" href="styles.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#172554;padding:20px}.reset-card{width:min(100%,520px);background:#fff;border-radius:20px;padding:38px;box-shadow:0 20px 60px #0002}.reset-card h1{color:#172554}.reset-card p{color:#64748b}.reset-card input{width:100%;padding:14px;border:1px solid #cbd5e1;border-radius:10px;margin:8px 0 16px}.reset-card button{width:100%;padding:14px;border:0;border-radius:10px;background:#4338ca;color:#fff;font-weight:700;cursor:pointer}.msg{margin-top:12px;color:#b91c1c;white-space:pre-wrap}.msg.ok{color:#15803d}</style></head><body><main class="reset-card"><h1>Set a new password</h1><p>Choose a new password for your AdvocateDesk account.</p><form id="resetForm" hidden><label for="pw">New password</label><input id="pw" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Update password</button></form><p id="status">Verifying your password reset link…</p><div id="msg" class="msg" role="alert"></div><p><a href="super-admin-login.html">Return to Super Admin Login</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(function(){const URL="https://ykxfidrtvmkmmbxameji.supabase.co";const KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlreGZpZHJ0dm1rbW1ieGFtZWppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODIwMjUsImV4cCI6MjEwNjQ1ODAyNX0.9m6LYk1i2i_B5iwNbjX5iYCHrGrnXFf-O7pFMWVDVDk";const client=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const form=document.getElementById("resetForm"),status=document.getElementById("status"),msg=document.getElementById("msg");function error(t){status.textContent="";msg.textContent=t;msg.className="msg"}client.auth.onAuthStateChange(function(event,session){if((event==="PASSWORD_RECOVERY"||event==="SIGNED_IN")&&session){form.hidden=false;status.textContent="Your reset link is verified. Enter your new password.";}});client.auth.getSession().then(function(r){if(r.error)throw r.error;if(r.data.session){form.hidden=false;status.textContent="Your reset link is verified. Enter your new password.";}else if(!location.hash.includes("access_token")&&!location.search.includes("code=")){error("This reset link is missing or expired. Request a new password recovery email.");}}).catch(function(e){error(e.message||"Unable to verify reset link. Request a new one.");});form.addEventListener("submit",async function(e){e.preventDefault();const p=document.getElementById("pw").value,c=document.getElementById("confirm").value;if(p.length<8){error("Use at least 8 characters.");return;}if(p!==c){error("Passwords do not match.");return;}const b=form.querySelector("button");b.disabled=true;b.textContent="Updating…";try{const r=await client.auth.updateUser({password:p});if(r.error)throw r.error;form.hidden=true;status.textContent="Password updated successfully. You can now sign in.";msg.textContent="";}catch(x){error(x.message||"Password update failed. Request a new reset link.");}finally{b.disabled=false;b.textContent="Update password";}});})();
