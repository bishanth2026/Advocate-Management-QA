name: AdvocateDesk Test Validation

on:
  push:
    branches:
      - staging/advocatedesk-test
  pull_request:
    branches:
      - feature/secure-documents-draft

permissions:
  contents: read

jobs:
  javascript-syntax:
    name: JavaScript syntax and security smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check authentication module syntax
        run: node --check auth.js
      - name: Check application module syntax
        run: node --check app.js
      - name: Check resource-store module syntax
        run: node --check resource-store.js
      - name: Run resource-store unit tests
        run: node tests/resource-store.test.js
      - name: Run resource-policy draft static contract tests
        run: node tests/resource-policy-draft.test.js
      - name: Run QA HTTP authorization harness static contract tests
        run: node tests/qa-authz-http-contract.test.js
      - name: Run disposable fixture template contract tests
        run: node tests/qa-fixture-template-contract.test.js
      - name: Run transactional save reference-model tests
        run: node tests/transactional-save-contract.test.js
      - name: Check static security contracts
        run: node scripts/security-smoke.mjs
