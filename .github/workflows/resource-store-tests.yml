name: Resource Store Unit Tests
on:
  push:
    branches:
      - staging/advocatedesk-test
    paths:
      - "resource-store.js"
      - "tests/resource-store.test.js"
      - "tests/resource-policy-draft.test.js"
      - "tests/transactional-save-contract.test.js"
      - "tests/qa-authz-http.test.js"
      - "tests/qa-authz-http-contract.test.js"
      - "tests/qa-authz-workspace-list-contract.test.js"
      - "tests/qa-fixture-template-contract.test.js"
      - "supabase/drafts/20261010_phase_c7h_task_permission_and_unlinked_scope_draft.sql"
      - ".github/workflows/resource-store-tests.yml"
  pull_request:
    branches:
      - staging/advocatedesk-test
    paths:
      - "resource-store.js"
      - "tests/resource-store.test.js"
      - ".github/workflows/resource-store-tests.yml"
jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run resource-store unit tests
        run: |
          node tests/resource-store.test.js
          node tests/resource-policy-draft.test.js
          node tests/transactional-save-contract.test.js
          node tests/qa-authz-http-contract.test.js
          node tests/qa-authz-workspace-list-contract.test.js
          node tests/qa-fixture-template-contract.test.js
          node tests/qa-authz-http.test.js
