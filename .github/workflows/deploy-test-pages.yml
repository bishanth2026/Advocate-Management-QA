name: AdvocateDesk Test Pages Deployment

on:
  push:
    branches:
      - staging/advocatedesk-test
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-staging
  cancel-in-progress: true

jobs:
  deploy-test:
    name: Deploy isolated test site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging/advocatedesk-test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload test site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy test site
        id: deployment
        uses: actions/deploy-pages@v4
