<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Login — AdvocateDesk</title><link rel="stylesheet" href="styles.css"></head><body class="login-page portal-login-page admin-login"><div class="login-card"><a class="back-login" href="login.html">← Back to portal selection</a><div class="login-brand"><div class="brand-mark">🛡️</div><div><strong>AdvocateDesk</strong><small>Admin Portal</small></div></div><h1>Admin Login</h1><p class="login-subtitle">Manage your law office and its authorized users.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" value="admin@advocatedesk.local" required></div><div class="field"><label>Password</label><input id="password" type="password" value="demo123" required></div><button class="login-submit" type="submit">Sign in as Admin</button><div id="error" class="login-error"></div></form><div class="demo-credentials"><strong>Demo access</strong><br>admin@advocatedesk.local<br>Password: demo123</div></div><script src="auth.js"></script><script>document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();var email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,users=[];try{users=JSON.parse(localStorage.getItem('advocateDeskUsers')||'[]')}catch(err){}var created=users.find(function(u){return u.role==='admin'&&String(u.email).toLowerCase()===email.toLowerCase()&&String(u.password)===password});if(created){var workspaceId=String(created.workspaceId||'').trim();if(!workspaceId){workspaceId='ws_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,10);created.workspaceId=workspaceId;try{localStorage.setItem('advocateDeskUsers',JSON.stringify(users))}catch(err){}}ADAuth.set('admin',created.name,email,workspaceId);location.href='app.html';return}if(email.toLowerCase()!=='admin@advocatedesk.local'||password!=='demo123'){document.getElementById('error').textContent='Invalid Admin email or password.';return}ADAuth.set('admin','Advocate Admin',email,'demo-admin');location.href='app.html'});</script></body></html>
