<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#111827">
<title>AdvocateDesk — Practice Management</title>
<link rel="stylesheet" href="styles.css?v=20261001-06">
<link rel="stylesheet" href="mobile-consolidated.css?v=20260926-1">
</head><body><div id="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">⚖</div><div><strong>AdvocateDesk</strong><small>Practice Management</small></div></div><nav id="nav"><button class="nav-item active" data-page="dashboard">▦ <span>Dashboard</span></button><button class="nav-item" data-page="case-client">⚖ <span>Case & Client</span></button><button class="nav-item" data-page="case-details">🔎 <span>Case 360°</span></button><button class="nav-item" data-page="client-management">◉ <span>Client Management</span></button><button class="nav-item" data-page="hearings">◷ <span>Hearings</span></button><button class="nav-item" data-page="calendar">▣ <span>Calendar</span></button><button class="nav-item" data-page="documents">▤ <span>Documents</span></button><button class="nav-item" data-page="tasks">✓ <span>Tasks</span></button><button class="nav-item" data-page="finance">₹ <span>Finance</span></button><button class="nav-item" data-page="reports">▥ <span>Reports</span></button></nav><div class="sidebar-bottom"><button class="nav-item" data-page="settings">⚙ <span>Settings</span></button><button class="nav-item admin-only" data-page="central-control"><span class="nav-icon">⚙</span><span>Central Control</span></button></div></aside><div class="mobile-overlay" id="mobileOverlay" aria-hidden="true"></div><main class="main"><header class="topbar"><button class="mobile-menu" id="mobileMenu">☰</button><input id="globalSearch" type="hidden" aria-hidden="true"><div class="top-actions"><button class="icon-btn" title="Notifications">♢</button><button class="user-chip">A <span>Advocate Admin</span> ▾</button></div></header><section id="content" class="content"></section></main></div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle">New Record</h3><button id="modalClose">×</button></div><div id="modalBody"></div></div></div>
<div id="cloudLoading" style="position:fixed;inset:0;z-index:99999;background:#f8fafc;display:grid;place-items:center;font:600 16px Arial;color:#172033">Connecting securely to AdvocateDesk…</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20261002-02"></script><script>
(async function(){
 const gate=document.getElementById('cloudLoading');
 function fail(message){gate.textContent=message+' Redirecting to secure login…';setTimeout(function(){location.replace('login.html')},1800);}
 try{
   const auth=await ADAuth.validateAppSession();
   if(!auth){fail('Your session is missing or expired.');return;}
   const client=ADAuth.client();
   const result=await client.from('practice_records').select('payload').eq('workspace_id',auth.workspaceId).eq('record_type','other').eq('record_key','workspace_state').maybeSingle();
   if(result.error)throw result.error;
   const empty={cases:[],clients:[],hearings:[],tasks:[],discussions:[],meetings:[],payments:[],invoices:[]};
   window.ADCloudInitialState=result.data&&result.data.payload&&typeof result.data.payload==='object'?result.data.payload:empty;
   let saveQueue=Promise.resolve();
   window.ADCloudSync={save:function(state){
     const snapshot=JSON.parse(JSON.stringify(state));
     saveQueue=saveQueue.then(async function(){
       const response=await client.from('practice_records').upsert({workspace_id:auth.workspaceId,record_type:'other',record_key:'workspace_state',payload:snapshot},{onConflict:'workspace_id,record_type,record_key'}).select('id').single();
       if(response.error)throw response.error;
       return response.data;
     });
     return saveQueue;
   }};
   const scripts=['app-core-fixes.js?v=20261001-02','app.js?v=20261002-01','hearing-filter.js?v=20260927-2','cases.js?v=20261001-01','calendar.js?v=20261001-01','task.js?v=20261001-02','mobile-keyboard.js?v=20260926-1','finance.js?v=20260927-2','client-management.js?v=20260926-1','user-menu.js?v=20260926-1'];
   for(const src of scripts)await new Promise(function(resolve,reject){const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=function(){reject(new Error('Unable to load '+src))};document.body.appendChild(s)});
   gate.remove();
   if(typeof window.__advocateDeskRestoreRoute==='function')window.__advocateDeskRestoreRoute();else if(typeof window.navigate==='function')window.navigate('dashboard');
 }catch(e){console.error('AdvocateDesk secure bootstrap failed',e);gate.textContent='Unable to connect securely: '+(e&&e.message||'Please try again')+' — returning to login…';setTimeout(function(){location.replace('login.html')},3000);}
})();
</script>
</body></html>
