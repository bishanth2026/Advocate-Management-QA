<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Super Admin Login — AdvocateDesk</title><link rel="stylesheet" href="styles.css"></head><body class="login-page portal-login-page super-login"><div class="login-card"><a class="back-login" href="login.html">← Back to portal selection</a><div class="login-brand"><div class="brand-mark">👑</div><div><strong>AdvocateDesk</strong><small>Super Admin Portal</small></div></div><h1>Super Admin Login</h1><p class="login-subtitle">Central control for all organizations and law offices.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" value="superadmin@advocatedesk.local" required></div><div class="field"><label>Password</label><input id="password" type="password" value="demo123" required></div><button class="login-submit" type="submit">Sign in as Super Admin</button><div id="error" class="login-error"></div></form><div class="demo-credentials"><strong>Demo access</strong><br>superadmin@advocatedesk.local<br>Password: demo123</div></div><script src="auth.js"></script><script>document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();var email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,users=[];try{users=JSON.parse(localStorage.getItem('advocateDeskUsers')||'[]')}catch(err){}var created=users.find(function(u){return u.role==='super_admin'&&String(u.email).toLowerCase()===email.toLowerCase()&&String(u.password)===password});if(created){ADAuth.set('super_admin',created.name,email);location.href='app.html';return}if(email.toLowerCase()!=='superadmin@advocatedesk.local'||password!=='demo123'){document.getElementById('error').textContent='Invalid Super Admin email or password.';return}ADAuth.set('super_admin','System Owner',email);location.href='app.html'});</script></body></html>
