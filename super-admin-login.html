<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Super Admin Login — AdvocateDesk</title><link rel="stylesheet" href="styles.css"></head><body class="login-page portal-login-page super-login"><div class="login-card"><a class="back-login" href="login.html">← Back to portal selection</a><div class="login-brand"><div class="brand-mark">👑</div><div><strong>AdvocateDesk</strong><small>Super Admin Portal</small></div></div><h1>Super Admin Login</h1><p class="login-subtitle">Sign in with your authorized platform administrator account.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="login-submit" type="submit">Sign in as Super Admin</button><div id="error" class="login-error" role="alert"></div></form><p class="login-subtitle">Use the email and password registered in your AdvocateDesk account.</p></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20261002-01"></script><script>document.getElementById('loginForm').addEventListener('submit',async function(e){e.preventDefault();var b=this.querySelector('button[type=submit]'),err=document.getElementById('error');b.disabled=true;b.textContent='Verifying...';err.textContent='';try{await ADAuth.signIn(document.getElementById('email').value,document.getElementById('password').value,'super_admin');location.replace('app.html#dashboard')}catch(x){err.textContent=x&&x.message?x.message:'Sign-in failed. Please try again.'}finally{b.disabled=false;b.textContent='Sign in as Super Admin'}});</script></body></html>
